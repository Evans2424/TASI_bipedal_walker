# TD3 Configuration - Hardcore Test
# Quick test configuration for hardcore mode training

# Environment settings
env:
  name: "BipedalWalker-v3"
  hardcore: true
  normalize_observations: true
  normalize_rewards: true
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0
  
  # Wrapper settings for hardcore mode
  use_bridge_wrapper: false
  use_hardcore_wrapper: true  # Enable HardcoreWrapper with frame skip and reward shaping
  frame_skip: 4  # Repeat actions for 4 frames
  smoothness_coef: 0.05  # Penalty for jerky actions
  angle_coef: 0.02  # Penalty for tilting
  angular_vel_coef: 0.01  # Penalty for rotation
  reward_clip_min: -10.0
  reward_clip_max: 10.0

# TD3 Algorithm parameters
algorithm:
  learning_rate: 3.0e-4
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  
  # Policy network
  net_arch: [256, 256]
  
  # TD3 specific
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5

# Training settings
training:
  total_timesteps: 5000000  # Short for testing
  n_envs: 4
  eval_freq: 10000
  eval_episodes: 5
  save_freq: 50000
  log_interval: 10
  tensorboard_log: "logs"
  
  # Early stopping
  early_stopping:
    use_reward_threshold: false
    reward_threshold: 300.0
    use_no_improvement_stop: false
    patience: 10
    min_evals: 5

# Checkpoint settings
checkpoint:
  save_path: "experiments/checkpoints/td3_hardcore_test"
  save_replay_buffer: false

# Experiment settings
experiment:
  name: "td3_hardcore_test"
  seed: 42
  device: "auto"
  verbose: 1
