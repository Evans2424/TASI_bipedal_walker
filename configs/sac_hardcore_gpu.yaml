# SAC Configuration - Hardcore Mode (Standard Obstacles)
# BipedalWalker-v3 hardcore with stumps, ladders, pitfalls (no bridges)

env:
  name: "BipedalWalker-v3"
  hardcore: true
  normalize_observations: true
  normalize_rewards: true  # CRITICAL for hardcore mode
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0
  
  # Hardcore wrapper (smoothness + stability penalties)
  use_bridge_wrapper: false
  use_hardcore_wrapper: true  # Enable smoothness and stability wrappers
  
  # Wrapper parameters
  frame_skip: 4
  smoothness_coef: 0.2  # Penalty for jerky actions
  hull_angle_coef: 0.1  # Penalty for tilting
  hull_angular_vel_coef: 0.05  # Penalty for rotation

# SAC Algorithm parameters (RL Zoo3 tuned for BipedalWalker)
algorithm:
  learning_rate: 7.3e-4           # RL Zoo3 tuned value
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.01                        # RL Zoo3 uses 0.01 (not 0.005)
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  
  # Policy network (RL Zoo3 architecture)
  net_arch: [400, 300]             # RL Zoo3 tuned architecture
  
  # Entropy tuning
  ent_coef: "auto"                 # Auto-tune entropy coefficient
  target_entropy: "auto"           # Let SB3 calculate optimal value
  use_sde: false                   # Don't use state-dependent exploration

# Training settings
training:
  total_timesteps: 10000000  # Restore to 10M as in working config
  n_envs: 8
  eval_freq: 25000
  eval_episodes: 10
  save_freq: 100000
  log_interval: 10
  
  # Early stopping (optional)
  early_stopping:
    use_reward_threshold: false
    reward_threshold: 300.0
    use_no_improvement_stop: true   # Recommended for hardcore
    patience: 15
    min_evals: 30
  
  # Evaluation
  eval_log_path: "experiments/logs/sac_hardcore"
  tensorboard_log: "experiments/logs/sac_hardcore"

# Checkpoint settings
checkpoint:
  save_path: "experiments/checkpoints/sac_hardcore"
  save_replay_buffer: false
  
# Experiment settings
experiment:
  name: "sac_hardcore"
  seed: 42
  device: "mps"
  verbose: 1
