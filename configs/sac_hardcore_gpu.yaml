# Stable-Baselines3 SAC Configuration for BipedalWalker HARDCORE
# Based on successful implementations and RL Baselines3 Zoo tuned hyperparameters
# Expected training time: 4-10 hours on Apple Silicon MPS
# Expected to need 10M+ timesteps for good performance
#
# Key improvements from research:
# - Frame skipping (skip=4) via custom wrapper
# - Reward clipping and shaping via custom wrapper
# - Action smoothness penalties for natural gaits
# - Lower entropy coefficient (0.005 vs 0.2)
# - Linear learning rate schedule
# - Official RL Zoo hyperparameters
#
# References:
# - https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/sac.yml
# - https://github.com/ugurcanozalp/td3-sac-bipedal-walker-hardcore-v3
# - https://janak-lal.com.np/solving-bipedal-walker-hardcore-challenge-with-soft-actor-critic-algorithm/

# Environment settings
env:
  name: "BipedalWalker-v3"
  hardcore: true  # Enable hardcore mode with obstacles!
  reward_scale: 1.0
  clip_observations: false
  clip_actions: true
  num_eval_envs: 5  # Number of environments for evaluation
  normalize_observations: true  # Critical for hardcore mode
  normalize_rewards: true  # Critical for hardcore mode
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0
  # Wrapper settings for hardcore mode
  use_hardcore_wrapper: true  # Enable frame skip, reward shaping, smoothness penalties
  frame_skip: 4  # Repeat actions for 4 frames (proven effective)
  smoothness_coef: 0.2  # INCREASED: Stronger penalty for jerky actions
  hull_angle_coef: 0.1  # INCREASED: Stronger penalty for tilting
  hull_angular_vel_coef: 0.05  # INCREASED: Stronger penalty for rotation

# Agent settings - SAC with RL Zoo tuned hyperparameters
agent:
  type: "sac"
  # Network architecture from RL Zoo
  hidden_dims: [400, 300]  # Standard proven architecture
  # Learning rate with linear schedule (decreases from 7.3e-4 to 0)
  learning_rate: 7.3e-4  # Will be wrapped in linear schedule
  use_linear_schedule: true  # Enable linear decay
  gamma: 0.99  # Discount factor
  tau: 0.01  # Target network update rate (RL Zoo uses 0.01, not 0.005)
  alpha: 0.2  # Initial entropy coefficient
  automatic_entropy_tuning: true  # Let SAC adapt entropy
  # Lower target entropy encourages more deterministic policy as training progresses
  # RL Zoo uses ent_coef=0.005 with auto tuning, which results in low entropy
  target_entropy: -0.5  # Lower than -action_dim (-4) for more focused policy

# Replay buffer settings
buffer:
  capacity: 2000000  # Larger buffer for more diverse experiences
  batch_size: 256  # Good balance for macOS

# Training settings - Based on RL Zoo successful configuration
training:
  total_timesteps: 10000000  # RL Zoo uses 10M for hardcore (1e7)
  learning_starts: 10000  # RL Zoo standard (not too high - let training begin sooner)
  train_frequency: 1  # Update every step
  gradient_steps: 1  # RL Zoo uses 1 (not 4) - this is correct for SAC
  eval_frequency: 25000  # Evaluate less frequently (expensive)
  eval_episodes: 10
  save_frequency: 100000  # Save checkpoints every 100k steps
  log_frequency: 2000

# Exploration settings
exploration:
  initial_random_steps: 10000  # Match learning_starts

# Acceleration settings (macOS optimized)
gpu:
  num_parallel_envs: 8  # Parallel environments for faster training

# Experiment settings
experiment:
  name: "sac_hardcore_gpu"
  seed: 42
  device: "mps"  # Metal Performance Shaders for Apple Silicon

# Paths
paths:
  checkpoints: "experiments/checkpoints"
  logs: "experiments/logs"
  videos: "experiments/videos"
