# Bridge Balanced SAC Configuration
# PROPERLY TUNED to fix all previous issues
#
# KEY FIXES:
# 1. Disabled reward normalization (we control scale ourselves)
# 2. Moderate bonuses that don't need extreme clipping (2-5x, not 20x)
# 3. Simple reward structure (just waiting + crossing)
# 4. Strict detection (avoid false positives)
# 5. Penalties always present (soft but consistent)
#
# REWARD MATH:
# - Waiting: +0.02/step × 300 steps = +6.0
# - Crossing: +8.0
# - Total bridge reward: ~+14 (equivalent to 14 terrain sections)
# - No clipping issues - rewards in reasonable range

env:
  name: "CustomBipedalWalker-v3"
  hardcore: true
  normalize_observations: true
  normalize_rewards: true           # ENABLED for consistency with hardcore/easy
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0

  # Use bridge wrapper
  use_hardcore_wrapper: false
  use_bridge_wrapper: true

  # Frame skip
  frame_skip: 4

  # MODERATE base penalties (soft but present)
  # smoothness_coef: 0.02             # Soft (between 0.01-0.03)
  # hull_angle_coef: 0.03             # Soft (between 0.02-0.04)
  # hull_angular_vel_coef: 0.015      # Soft (between 0.01-0.02)

  # BALANCED penalties - Strong enough for natural movement, weak enough for bridge learning
  # ~40% of hardcore strength (hardcore: 0.2/0.1/0.05)
  smoothness_coef: 0.08            # Medium strength (encourage smooth actions)
  hull_angle_coef: 0.05            # Medium strength (encourage upright posture)
  hull_angular_vel_coef: 0.025     # Medium strength (reduce spinning)


  # Movement quality
  knee_bend_reward: 0.02
  min_bend_threshold: 0.3

  # MODERATE bridge shaping (SIMPLE - just 2 bonuses)
  stable_waiting_bonus: 0.03        # +0.02/step (300 steps = +6.0 total)
  bridge_cross_bonus: 10.0           # +8.0 for crossing
  # NO detect_bonus, NO stop_bonus, NO velocity_bonus

  # Anti-exploit (stricter)
  min_progress_for_bonuses: 15.0
  max_waiting_steps: 400

  # Detection (STRICT - avoid false positives)
  lidar_bridge_threshold: 0.5       # Stricter (was 1.0)
  min_close_beams: 3                # Need 3+ beams (wide obstacle)
  waiting_velocity_threshold: 0.15
  waiting_angle_threshold: 0.3

  # Evaluation
  num_eval_envs: 5

# SAC Algorithm parameters (RL Zoo3 tuned for BipedalWalker)
agent:
  learning_rate: 7.3e-4           # RL Zoo3 tuned value
  buffer_size: 2000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.01                        # RL Zoo3 uses 0.01
  gamma: 0.99                      # Natural walking: prioritize immediate rewards
  train_freq: 1
  gradient_steps: 1                # Single update per step (faster, same as easy/hardcore)
  
  # Policy network (RL Zoo3 architecture)
  net_arch: [400, 300]             # RL Zoo3 tuned architecture
  
  # Entropy tuning
  ent_coef: "auto"                 # Auto-tune entropy coefficient
  target_entropy: "auto"           # Let SB3 calculate optimal value
  use_sde: false                   # Don't use state-dependent exploration

# Training settings
training:
  total_timesteps: 10000000
  n_envs: 8
  eval_freq: 25000
  eval_episodes: 10
  save_freq: 100000
  log_interval: 10
  
  # Early stopping
  early_stopping:
    use_reward_threshold: false
    reward_threshold: 300.0
    use_no_improvement_stop: true
    patience: 15
    min_evals: 30
  
  # Evaluation
  eval_log_path: "experiments/logs/sac_bridge_balanced"
  tensorboard_log: "experiments/logs/sac_bridge_balanced"

# Checkpoint settings
checkpoint:
  save_path: "experiments/checkpoints/sac_bridge_balanced"
  save_replay_buffer: false

# Experiment settings
experiment:
  name: "sac_bridge_balanced"
  seed: 99
  device: "mps"
  verbose: 1
