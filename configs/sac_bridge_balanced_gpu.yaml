# Bridge Balanced SAC Configuration
# PROPERLY TUNED to fix all previous issues
#
# KEY FIXES:
# 1. Disabled reward normalization (we control scale ourselves)
# 2. Moderate bonuses that don't need extreme clipping (2-5x, not 20x)
# 3. Simple reward structure (just waiting + crossing)
# 4. Strict detection (avoid false positives)
# 5. Penalties always present (soft but consistent)
#
# REWARD MATH:
# - Waiting: +0.02/step × 300 steps = +6.0
# - Crossing: +8.0
# - Total bridge reward: ~+14 (equivalent to 14 terrain sections)
# - No clipping issues - rewards in reasonable range

env:
  name: "CustomBipedalWalker-v3"
  hardcore: true
  normalize_observations: true
  normalize_rewards: false          # DISABLED - we control reward scale
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0

  # Use balanced wrapper
  use_bridge_balanced: true

  # Frame skip
  frame_skip: 4

  # MODERATE base penalties (soft but present)
  smoothness_coef: 0.02             # Soft (between 0.01-0.03)
  hull_angle_coef: 0.03             # Soft (between 0.02-0.04)
  hull_angular_vel_coef: 0.015      # Soft (between 0.01-0.02)

  # Movement quality
  knee_bend_reward: 0.02
  min_bend_threshold: 0.3

  # MODERATE bridge shaping (SIMPLE - just 2 bonuses)
  stable_waiting_bonus: 0.02        # +0.02/step (300 steps = +6.0 total)
  bridge_cross_bonus: 8.0           # +8.0 for crossing
  # NO detect_bonus, NO stop_bonus, NO velocity_bonus

  # Anti-exploit (stricter)
  min_progress_for_bonuses: 15.0
  max_waiting_steps: 400

  # Detection (STRICT - avoid false positives)
  lidar_bridge_threshold: 0.5       # Stricter (was 1.0)
  min_close_beams: 3                # Need 3+ beams (wide obstacle)
  waiting_velocity_threshold: 0.15
  waiting_angle_threshold: 0.3

  # Evaluation
  num_eval_envs: 5

# SAC hyperparameters (proven from RL Zoo3)
agent:
  type: "sac"
  hidden_dims: [400, 300]
  learning_rate: 7.3e-4
  use_linear_schedule: true
  gamma: 0.99
  tau: 0.01
  alpha: 0.2
  automatic_entropy_tuning: true
  target_entropy: -0.5

buffer:
  capacity: 2000000
  batch_size: 256

training:
  total_timesteps: 10000000         # 10M steps (shorter for testing)
  learning_starts: 10000
  train_frequency: 1
  gradient_steps: 1
  eval_frequency: 25000
  eval_episodes: 10
  save_frequency: 100000
  log_frequency: 2000

experiment:
  name: "sac_bridge_balanced_gpu"
  seed: 99
  device: "auto"

paths:
  checkpoints: "experiments/checkpoints"
  logs: "experiments/logs"

gpu:
  num_parallel_envs: 8
