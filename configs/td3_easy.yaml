# TD3 Configuration - Easy Mode (Non-Hardcore)
# Standard BipedalWalker-v3 environment without obstacles

env:
  name: "BipedalWalker-v3"
  hardcore: false
  normalize_observations: true
  normalize_rewards: true
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0
  
  # No custom wrapper for easy mode
  use_bridge_wrapper: false
  use_hardcore_wrapper: false
  
  # Frame skip
  frame_skip: 1  # No frame skip for easy mode

# TD3 Algorithm parameters
algorithm:
  learning_rate: 3.0e-4
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  
  # Policy network
  net_arch: [400, 300]
  
  # TD3 specific
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5

# Training settings
training:
  total_timesteps: 1000000
  n_envs: 4
  eval_freq: 10000
  eval_episodes: 10
  save_freq: 50000
  log_interval: 10
  tensorboard_log: "logs"
  
  # Early stopping (optional)
  early_stopping:
    use_reward_threshold: false
    reward_threshold: 300.0
    use_no_improvement_stop: false
    patience: 10
    min_evals: 5

# Checkpoint settings
checkpoint:
  save_path: "experiments/checkpoints/td3_easy_2"
  save_replay_buffer: false

# Experiment settings
experiment:
  name: "td3_easy_2"
  seed: 42
  device: "auto"
  verbose: 1
