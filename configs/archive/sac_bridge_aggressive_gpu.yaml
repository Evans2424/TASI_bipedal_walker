# Bridge Aggressive SAC Configuration
# EXTREME shaping to force bridge learning
#
# STRATEGY:
# - Massive crossing bonus (+20) makes waiting worth it
# - Strong per-step waiting reward (+0.1) provides continuous feedback
# - Zero penalties when near bridge
# - Forward velocity bonus encourages movement between bridges

env:
  name: "CustomBipedalWalker-v3"
  hardcore: true
  normalize_observations: true
  normalize_rewards: true
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0

  # Aggressive bridge wrapper
  use_bridge_aggressive: true

  # Frame skip
  frame_skip: 4

  # MINIMAL base penalties
  smoothness_coef: 0.01           # Almost none (was 0.03)
  hull_angle_coef: 0.02           # Almost none (was 0.04)
  hull_angular_vel_coef: 0.01     # Almost none (was 0.02)

  # Movement quality
  knee_bend_reward: 0.02
  min_bend_threshold: 0.3

  # AGGRESSIVE bridge shaping
  stable_waiting_reward: 0.1      # STRONG: +0.1 per step
  bridge_cross_bonus: 20.0        # HUGE: +20 for crossing
  bridge_detect_bonus: 2.0        # +2 for detecting bridge
  bridge_stop_bonus: 3.0          # +3 for stopping near bridge

  # Forward movement bonus
  forward_velocity_bonus: 0.5     # Encourage continuous movement

  # Anti-exploit (but permissive)
  min_progress_for_bonuses: 10.0  # Lower threshold
  max_waiting_steps: 400

  # Detection (PERMISSIVE)
  lidar_bridge_threshold: 1.0     # Easier detection
  waiting_velocity_threshold: 0.2  # More permissive
  waiting_angle_threshold: 0.4     # More permissive

# SAC hyperparameters
agent:
  type: "sac"
  hidden_dims: [400, 300]
  learning_rate: 7.3e-4
  use_linear_schedule: true
  gamma: 0.99
  tau: 0.01
  alpha: 0.2
  automatic_entropy_tuning: true
  target_entropy: -0.5

buffer:
  capacity: 2000000
  batch_size: 256

training:
  total_timesteps: 15000000       # 15M steps
  learning_starts: 10000
  train_frequency: 1
  gradient_steps: 1
  eval_frequency: 25000
  eval_episodes: 10
  save_frequency: 100000
  log_frequency: 2000

experiment:
  name: "sac_bridge_aggressive_gpu"
  seed: 99
  device: "auto"

paths:
  checkpoints: "experiments/checkpoints"
  logs: "experiments/logs"

gpu:
  num_parallel_envs: 8
