# TD3 Configuration - Hardcore Advanced with Bridges
# Uses custom walker environment with BridgeBalancedWrapper

# Environment settings
env:
  name: "BipedalWalker-v3"
  hardcore: true
  normalize_observations: true
  normalize_rewards: false  # BridgeBalancedWrapper already clips rewards
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0
  
  # Bridge wrapper settings
  use_bridge_wrapper: true  # Use BridgeBalancedWrapper for bridge-specific reward shaping
  use_hardcore_wrapper: false  # Disabled when using bridge wrapper
  
  # Bridge-specific parameters
  frame_skip: 4
  smoothness_coef: 0.02  # Action smoothness penalty
  hull_angle_coef: 0.03  # Hull angle penalty
  hull_angular_vel_coef: 0.015  # Angular velocity penalty
  knee_bend_reward: 0.02
  min_bend_threshold: 0.3
  stable_waiting_bonus: 0.02
  bridge_cross_bonus: 8.0
  min_progress_for_bonuses: 15.0
  max_waiting_steps: 400
  lidar_bridge_threshold: 0.5
  min_close_beams: 3
  waiting_velocity_threshold: 0.15
  waiting_angle_threshold: 0.3

# TD3 Algorithm parameters
algorithm:
  learning_rate: 3.0e-4
  buffer_size: 1000000
  learning_starts: 20000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  
  # Policy network
  net_arch: [400, 300]
  
  # TD3 specific
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5

# Training settings
training:
  total_timesteps: 5000000
  n_envs: 4
  eval_freq: 20000
  eval_episodes: 10
  save_freq: 100000
  log_interval: 10
  tensorboard_log: "logs"
  
  # Early stopping
  early_stopping:
    use_reward_threshold: false
    reward_threshold: 300.0
    use_no_improvement_stop: false
    patience: 10
    min_evals: 5

# Checkpoint settings
checkpoint:
  save_path: "experiments/checkpoints/td3_hardcore_advanced_bridges"
  save_replay_buffer: false

# Experiment settings
experiment:
  name: "td3_hardcore_advanced_bridges"
  seed: 42
  device: "auto"
  verbose: 1
