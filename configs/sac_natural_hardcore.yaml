# Elite Hardcore Configuration: Unified integration of proven approaches
# Combines hardcore obstacle navigation with natural walking quality
#
# Strategy:
# - STRONG hardcore features (proven for obstacles): frame skip, L2 smoothness, hull stability
# - WEAK natural walking augmentations (for gait): knee bending, joint velocity limits, early stability
# - NO velocity constraints (standing/running penalties were solving video bug, not training issue!)
# - Uses all proven RL Zoo hyperparameters for hardcore mode
#
# VERSION HISTORY:
# V1: Initial implementation (had standing still exploit)
# V2: Anti-exploit fixes (conditional bonuses, standing penalty) - but moved too fast
# V3: Natural speed fixes (gentler standing penalty, max velocity limit, lower thresholds)
# V3.1: Immediate start fix (time-scaled standing penalty stronger in first 50 steps)
# V3.2: Truly slow walking (max_velocity 0.6→0.35, penalty 0.1→0.5, target 0.2-0.35)
# V3.3: Economics fix (penalty 0.5→5.0 to counteract base env speed incentive)
# V4: Simplification - removed velocity constraints (video bug!), back to proven basics ⭐
#
# Expected training time: 4-10 hours on Apple Silicon MPS
# Expected to need 10M timesteps for good performance
#
# References:
# - configs/sac_hardcore_gpu.yaml: Proven hardcore hyperparameters
# - hardcore_wrappers.py: Frame skip, L2 smoothness, hull stability patterns
# - smooth_natural_wrapper.py: Natural walking augmentation patterns

# Environment settings
env:
  name: "BipedalWalker-v3"
  hardcore: true  # Enable hardcore mode with obstacles
  reward_scale: 1.0
  clip_observations: false
  clip_actions: true
  num_eval_envs: 5
  normalize_observations: true  # Critical for hardcore mode
  normalize_rewards: true  # Critical for hardcore mode
  clip_normalized_obs: 10.0
  clip_normalized_reward: 10.0

  use_bridge_wrapper: false
  use_hardcore_wrapper: true

  # Core hardcore features (STRONG - proven for obstacles)
  frame_skip: 4  # Reduces decision frequency
  smoothness_coef: 0.2  # L2 action smoothness (STRONG)
  hull_angle_coef: 0.1  # Hull angle stability (STRONG)
  hull_angular_vel_coef: 0.05  # Hull angular velocity stability (STRONG)

  # Natural walking augmentations (WEAK - for gait quality)
  knee_bend_reward: 0.02  # Knee bending during swing (10x weaker than smoothness)
  min_bend_threshold: 0.3  # Minimum knee bend to get reward
  max_joint_velocity: 2.0  # Maximum joint velocity before penalty
  velocity_penalty: 0.02  # Joint velocity excess penalty (10x weaker than smoothness)
  early_steps_stability_bonus: 0.01  # Early stability bonus (20x weaker than smoothness)
  early_steps_count: 100  # Number of early steps for stability bonus

# Agent settings - RL Zoo proven hyperparameters (from sac_hardcore_gpu.yaml)
agent:
  type: "sac"
  # Network architecture from RL Zoo
  hidden_dims: [400, 300]
  # Learning rate with linear schedule (decreases from 7.3e-4 to 0)
  learning_rate: 7.3e-4
  use_linear_schedule: true  # Enable linear decay
  gamma: 0.99  # Discount factor
  tau: 0.01  # Target network update rate
  alpha: 0.2  # Initial entropy coefficient
  automatic_entropy_tuning: true  # Let SAC adapt entropy
  target_entropy: -4  # Lower than -action_dim for more focused policy

# Replay buffer settings
buffer:
  capacity: 2000000  # Larger buffer for more diverse experiences
  batch_size: 256

# Training settings - Based on RL Zoo successful configuration
training:
  total_timesteps: 10000000  # RL Zoo uses 10M for hardcore
  learning_starts: 10000
  train_frequency: 1  # Update every step
  gradient_steps: 1  # RL Zoo uses 1 (not 4) for SAC
  eval_frequency: 25000  # Evaluate less frequently
  eval_episodes: 10
  save_frequency: 100000  # Save checkpoints every 100k steps
  log_frequency: 2000
  n_envs: 8

  tensorboard_log: "experiments/logs/sac_hardcore"

# Exploration settings
exploration:
  initial_random_steps: 10000  # Match learning_starts

# Acceleration settings (macOS optimized)
gpu:
  num_parallel_envs: 8  # Parallel environments for faster training

# Experiment settings
experiment:
  name: "sac_elite_unified_hardcore_gpu"  # Elite = unified integration (not stacking)
  seed: 99  # Different from baseline hardcore (42) and failed stacking attempt (55)
  device: "mps"  # Metal Performance Shaders for Apple Silicon

# Paths
checkpoint:
  save_path: "experiments/checkpoints"
  logs: "experiments/logs"
  videos: "experiments/videos"
