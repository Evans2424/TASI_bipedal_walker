# Stable-Baselines3 SAC Configuration (macOS Apple Silicon Optimized)
# Production-ready implementation with MPS (Metal Performance Shaders) acceleration
# Expected time: 30min - 2 hours on Apple Silicon

# Environment settings
env:
  name: "BipedalWalker-v3"
  hardcore: false
  reward_scale: 1.0
  clip_observations: false
  clip_actions: true
  num_eval_envs: 5  # Number of environments for evaluation
  normalize_observations: true  # Use VecNormalize for obs
  normalize_rewards: true  # Use VecNormalize for rewards
  clip_normalized_obs: 10.0  # Clip normalized observations
  clip_normalized_reward: 10.0  # Clip normalized rewards

# Agent settings - SB3 SAC optimized
agent:
  type: "sac"
  hidden_dims: [400, 300]
  learning_rate: 7.3e-4
  gamma: 0.98
  tau: 0.01
  alpha: 0.2
  automatic_entropy_tuning: true
  target_entropy: null

# Replay buffer settings
buffer:
  capacity: 1000000
  batch_size: 256  # Reduced for macOS - increase to 512 if you have sufficient memory

# Training settings
training:
  total_timesteps: 1500000
  learning_starts: 10000
  train_frequency: 1
  gradient_steps: 4      # Multiple gradient steps per env step
  eval_frequency: 10000
  eval_episodes: 10
  save_frequency: 50000
  log_frequency: 1000

# Exploration settings
exploration:
  initial_random_steps: 10000

# Acceleration settings (macOS optimized)
gpu:
  num_parallel_envs: 8  # Reduced from 16 for macOS - increase if you have M2/M3 Pro/Max/Ultra
  # Note: mixed_precision and pin_memory are CUDA-specific and not used on macOS

# Experiment settings
experiment:
  name: "sac_sb3_gpu"
  seed: 45
  device: "mps"  # Metal Performance Shaders for Apple Silicon (auto-fallback to CPU if unavailable)

# Paths
paths:
  checkpoints: "experiments/checkpoints"
  logs: "experiments/logs"
  videos: "experiments/videos"
