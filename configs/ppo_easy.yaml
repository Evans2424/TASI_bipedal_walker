# PPO Configuration for Bipedal Walker

# Environment settings
env:
  name: "BipedalWalker-v3"
  hardcore: false
  reward_scale: 1.0
  clip_observations: false
  clip_actions: true
  use_hardcore_wrapper: true
  use_bridge_wrapper: false

agent:
  type: "ppo"
  hidden_dims: [256, 256]
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  n_epochs: 10
  clip_range: 0.2
  n_steps: 128
  batch_size: 256

training:
  total_timesteps: 2500000
  eval_frequency: 2048  # Evaluate every N steps
  eval_episodes: 10
  save_frequency: 50000  # Save checkpoint every N steps
  log_frequency: 1000  # Log metrics every N steps
  num_envs: 16

experiment:
  name: "ppo_easy"
  seed: 42
  device: "cuda"